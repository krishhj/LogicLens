<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogicLens | AI Interview Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      /* Custom scrollbar for the AI Tutor panel */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #0b0e14;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
  </head>
  <body class="bg-[#0b0e14] text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const { motion } = window.Motion || window.FramerMotion;

      // --- ALGORITHM LIBRARY ---
      const algoSnippets = {
        constant: {
          name: "First Element",
          code: "function getFirst(arr) {\n  return arr[0];\n}",
        },
        binary: {
          name: "Binary Search",
          code: "function binarySearch(arr, target) {\n  let left = 0;\n  let right = arr.length - 1;\n  while (left <= right) {\n    let mid = Math.floor((left+right)/2);\n    if (arr[mid] === target) return mid;\n    if (arr[mid] < target) left = mid + 1;\n    else right = mid - 1;\n  }\n}",
        },
        linear: {
          name: "Linear Search",
          code: "function search(arr, target) {\n  for (let i = 0; i < arr.length; i++) {\n    if (arr[i] === target) return i;\n  }\n}",
        },
        bubble: {
          name: "Bubble Sort",
          code: "function bubbleSort(arr) {\n  for (let i = 0; i < arr.length; i++) {\n    for (let j = 0; j < arr.length - i - 1; j++) {\n      if (arr[j] > arr[j+1]) {\n        let temp = arr[j];\n        arr[j] = arr[j+1];\n        arr[j+1] = temp;\n      }\n    }\n  }\n}",
        },
      };

      const LogicLens = () => {
        const [inputType, setInputType] = useState("template"); // "template" or "custom"
        const [arrayInput, setArrayInput] = useState("30, 10, 45, 20, 15"); // NEW STATE FOR USER INPUT
        const [array, setArray] = useState([30, 10, 45, 20, 15]);
        const [activeIndices, setActiveIndices] = useState([]);
        const [status, setStatus] = useState("System Ready");
        const [isAnimating, setIsAnimating] = useState(false);
        const [opCount, setOpCount] = useState(0);
        const [speed, setSpeed] = useState(400);
        const [selectedAlgo, setSelectedAlgo] = useState("bubble");
        const [customCode, setCustomCode] = useState(
          algoSnippets["bubble"].code,
        );
        const [algoInfo, setAlgoInfo] = useState({
          name: "Pending",
          time: "--",
          space: "--",
        });
        const [interviewSteps, setInterviewSteps] = useState([]); // NEW STATE FOR AI TUTOR

        const chartRef = useRef(null);
        const chartInstance = useRef(null);

        // Initialize Chart
        useEffect(() => {
          const ctx = chartRef.current.getContext("2d");
          if (chartInstance.current) chartInstance.current.destroy();
          chartInstance.current = new Chart(ctx, {
            type: "line",
            data: {
              labels: [10, 20, 30, 40, 50],
              datasets: [
                {
                  label: "Scaling",
                  data: [100, 400, 900, 1600, 2500],
                  borderColor: "#818cf8",
                  tension: 0.4,
                  fill: true,
                  backgroundColor: "rgba(129, 140, 248, 0.1)",
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { display: false },
                y: { grid: { color: "#1e293b" }, ticks: { color: "#64748b" } },
              },
            },
          });
        }, []);

        const updateChart = (timeComplexity) => {
          const nValues = [10, 20, 30, 40, 50];
          let newData = [];
          if (timeComplexity.includes("n²") || timeComplexity.includes("n^2"))
            newData = nValues.map((n) => n * n);
          else if (timeComplexity.includes("log"))
            newData = nValues.map((n) => Math.log2(n) * 300);
          else if (timeComplexity.includes("n"))
            newData = nValues.map((n) => n * 40);
          else newData = nValues.map((n) => 200);

          if (chartInstance.current) {
            chartInstance.current.data.datasets[0].data = newData;
            chartInstance.current.update();
          }
        };

        const handleAnalyze = async () => {
          if (isAnimating) return;

          // Convert string "10, 20, 30" -> Array [10, 20, 30]
          const parsedArray = arrayInput
            .split(",")
            .map((n) => parseInt(n.trim()))
            .filter((n) => !isNaN(n));

          // Failsafe: Ensure they typed valid numbers
          if (parsedArray.length === 0) {
            setStatus("Error: Please enter valid numbers separated by commas.");
            return;
          }

          setOpCount(0);
          setIsAnimating(true);
          setStatus("AI Analyzing...");
          setInterviewSteps([]); // Clear previous tutor explanation

          try {
            const response = await fetch("http://localhost:5000/api/analyze", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                array: parsedArray, // SEND THE USER'S PARSED ARRAY
                code: customCode,
                algorithm: inputType === "template" ? selectedAlgo : null,
              }),
            });
            const data = await response.json();

            setAlgoInfo({
              name: data.algorithm,
              time: data.complexity.time,
              space: data.complexity.space,
            });
            setInterviewSteps(data.interview_steps || []); // Save AI explanation
            updateChart(data.complexity.time);
            playAnimation(data.steps);
          } catch (err) {
            setStatus("Connection Error: Check Server");
            setIsAnimating(false);
          }
        };

        const playAnimation = async (steps) => {
          for (let i = 0; i < steps.length; i++) {
            setOpCount(i + 1);
            setArray(steps[i].array);
            setActiveIndices(steps[i].highlight);
            setStatus(steps[i].explanation);
            await new Promise((r) => setTimeout(r, speed));
          }
          setIsAnimating(false);
          setActiveIndices([]);
          setStatus("Execution Complete");
        };

        return (
          <div className="h-screen flex flex-col font-sans overflow-hidden">
            <header className="p-4 border-b border-slate-800 bg-[#11151c] flex justify-between items-center shrink-0">
              <h1 className="text-xl font-bold text-white italic">
                LogicLens{" "}
                <span className="text-xs text-indigo-500 ml-2 uppercase tracking-widest">
                  Interview Prep
                </span>
              </h1>
              <div className="text-xs font-mono text-slate-400">{status}</div>
            </header>

            <main className="flex-1 grid grid-cols-12 gap-4 p-6 overflow-hidden">
              {/* LEFT COLUMN: CONTROLS */}
              <div className="col-span-4 flex flex-col gap-4 overflow-hidden">
                <div className="bg-[#161b22] border border-slate-800 rounded-xl p-5 shadow-xl shrink-0">
                  <h2 className="text-[10px] font-bold text-slate-500 mb-4 uppercase tracking-widest text-center">
                    Logic Controller
                  </h2>

                  {/* CUSTOM ARRAY INPUT */}
                  <div className="mb-4">
                    <label className="text-[10px] text-slate-500 uppercase mb-2 block">
                      Data Array (Comma Separated)
                    </label>
                    <input
                      type="text"
                      value={arrayInput}
                      onChange={(e) => setArrayInput(e.target.value)}
                      className="w-full bg-[#0b0e14] text-indigo-400 font-mono text-xs border border-slate-800 rounded-lg p-3 outline-none focus:border-indigo-500"
                      placeholder="e.g., 30, 10, 45, 20, 15"
                    />
                  </div>

                  {/* MODE TOGGLE TABS */}
                  <div className="flex bg-[#0b0e14] rounded-lg p-1 mb-4 border border-slate-800">
                    <button
                      className={`flex-1 text-[10px] uppercase font-bold py-2 rounded transition-colors ${inputType === "template" ? "bg-indigo-600 text-white" : "text-slate-500 hover:text-slate-300"}`}
                      onClick={() => {
                        setInputType("template");
                        setCustomCode(algoSnippets[selectedAlgo].code);
                      }}
                    >
                      Templates
                    </button>
                    <button
                      className={`flex-1 text-[10px] uppercase font-bold py-2 rounded transition-colors ${inputType === "custom" ? "bg-indigo-600 text-white" : "text-slate-500 hover:text-slate-300"}`}
                      onClick={() => {
                        setInputType("custom");
                        setCustomCode(
                          "// Write or paste your custom code here...\nfunction myAlgorithm(arr) {\n  \n}",
                        );
                      }}
                    >
                      Custom Code
                    </button>
                  </div>

                  {inputType === "template" && (
                    <div className="mb-4">
                      <select
                        value={selectedAlgo}
                        onChange={(e) => {
                          const key = e.target.value;
                          setSelectedAlgo(key);
                          setCustomCode(algoSnippets[key].code);
                        }}
                        className="w-full bg-[#0b0e14] text-indigo-400 text-sm border border-slate-800 rounded-lg p-3 outline-none focus:border-indigo-500"
                      >
                        <option value="constant">Constant Time [O(1)]</option>
                        <option value="linear">Linear Search [O(n)]</option>
                        <option value="binary">Binary Search [O(log n)]</option>
                        <option value="bubble">Bubble Sort [O(n²)]</option>
                      </select>
                    </div>
                  )}

                  <textarea
                    value={customCode}
                    onChange={(e) => setCustomCode(e.target.value)}
                    readOnly={inputType === "template"}
                    className={`w-full h-32 bg-[#0b0e14] font-mono text-xs border border-slate-800 rounded-lg p-3 mb-4 outline-none resize-none ${inputType === "template" ? "text-slate-500 cursor-not-allowed" : "text-emerald-400 focus:border-indigo-500"}`}
                    spellCheck="false"
                  />

                  <div className="grid grid-cols-3 gap-2 mb-4">
                    <div className="bg-[#0b0e14] p-2 border border-slate-800 rounded text-center flex flex-col justify-center">
                      <div className="text-[8px] text-slate-500 uppercase mb-1">
                        Detected
                      </div>
                      <div
                        className="text-[9px] font-bold text-indigo-400 truncate leading-tight"
                        title={algoInfo.name}
                      >
                        {algoInfo.name}
                      </div>
                    </div>
                    <div className="bg-[#0b0e14] p-2 border border-slate-800 rounded text-center flex flex-col justify-center">
                      <div className="text-[8px] text-slate-500 uppercase mb-1">
                        Complexity
                      </div>
                      <div className="text-xs font-bold text-emerald-400">
                        {algoInfo.time}
                      </div>
                    </div>
                    <div className="bg-[#0b0e14] p-2 border border-slate-800 rounded text-center flex flex-col justify-center">
                      <div className="text-[8px] text-slate-500 uppercase mb-1">
                        Operations
                      </div>
                      <div className="text-xs font-bold text-white">
                        {opCount}
                      </div>
                    </div>
                  </div>

                  <button
                    id="analyze-btn"
                    onClick={handleAnalyze}
                    disabled={isAnimating}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-bold transition-all disabled:opacity-50"
                  >
                    {isAnimating ? "Processing..." : "Analyze & Visualize"}
                  </button>
                </div>

                <div className="flex-1 bg-[#161b22] border border-slate-800 rounded-xl p-5 shadow-xl flex flex-col min-h-[150px]">
                  <h2 className="text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-widest text-center">
                    Theoretical Scaling
                  </h2>
                  <div className="flex-1 relative">
                    <canvas ref={chartRef}></canvas>
                  </div>
                </div>
              </div>

              {/* RIGHT COLUMN: VISUALIZER & TUTOR */}
              <div className="col-span-8 flex flex-col gap-4 overflow-hidden">
                {/* TOP: VISUALIZER */}
                <div className="bg-[#161b22] border border-slate-800 rounded-xl p-6 flex items-center justify-center relative shadow-inner h-[280px] shrink-0">
                  <div className="flex items-end justify-center gap-3 w-full h-full pt-8">
                    {array.map((val, idx) => {
                      // 1. Find the highest number in the array to calculate scale
                      const maxVal = Math.max(...array);
                      // 2. Ensure the tallest bar is always 200px max
                      const dynamicHeight =
                        maxVal > 0 ? (val / maxVal) * 200 : 10;

                      return (
                        <motion.div
                          key={idx}
                          layout
                          className="relative flex justify-center"
                          style={{
                            height: `${dynamicHeight}px`, // Use the new dynamic height
                            width: "50px",
                            backgroundColor: activeIndices.includes(idx)
                              ? "#818cf8"
                              : "#334155",
                            borderRadius: "6px 6px 0 0",
                            boxShadow: activeIndices.includes(idx)
                              ? "0 0 15px #818cf8"
                              : "none",
                          }}
                          transition={{
                            type: "spring",
                            stiffness: 300,
                            damping: 30,
                          }}
                        >
                          <span className="absolute -top-6 text-[10px] font-bold text-slate-400">
                            {val}
                          </span>
                        </motion.div>
                      );
                    })}
                  </div>
                </div>

                {/* BOTTOM: AI INTERVIEW BREAKDOWN */}
                <div className="flex-1 bg-[#161b22] border border-slate-800 rounded-xl p-6 flex flex-col overflow-hidden shadow-xl">
                  <div className="flex items-center gap-2 mb-4 shrink-0">
                    <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    <h2 className="text-xs font-bold text-slate-300 uppercase tracking-widest">
                      AI Interview Tutor
                    </h2>
                  </div>

                  <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                    {interviewSteps.length > 0 ? (
                      <div className="space-y-3">
                        {interviewSteps.map((step, idx) => {
                          const parts = step.split(":");
                          return (
                            <div
                              key={idx}
                              className="bg-[#0b0e14] border border-slate-800 p-4 rounded-lg text-sm text-slate-300 leading-relaxed shadow-sm"
                            >
                              {parts.length > 1 ? (
                                <>
                                  <strong className="text-indigo-400">
                                    {parts[0]}:
                                  </strong>
                                  {parts.slice(1).join(":")}
                                </>
                              ) : (
                                step
                              )}
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      <div className="h-full flex flex-col items-center justify-center text-slate-600 space-y-2">
                        <svg
                          className="w-8 h-8 opacity-50"
                          fill="none"
                          stroke="currentColor"
                          viewBox="0 0 24 24"
                        >
                          <path
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            strokeWidth="2"
                            d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"
                          ></path>
                        </svg>
                        <p className="text-xs font-mono uppercase tracking-widest">
                          Awaiting Code Submission...
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<LogicLens />);
    </script>
  </body>
</html>
